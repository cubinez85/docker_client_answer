upstream client_answer_backend {
    server 127.0.0.1:8092; # Порт, проброшенный из Docker-контейнера
}

# HTTP → HTTPS редирект
server {
    listen 80;
    server_name client-answer.cubinez.ru;

    return 301 https://$host$request_uri;
}

# HTTPS сервер
server {
    listen 443 ssl http2;
    server_name client-answer.cubinez.ru;

    ssl_certificate     /etc/nginx/ssl/client_answer/client_answer.crt;
    ssl_certificate_key /etc/nginx/ssl/client_answer/client_answer.key;

    # SSL настройки (рекомендуемые)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Static files
    location /static/ {
        # ВАЖНО: слэши в конце и location, и alias должны совпадать
        alias /home/cubinez85/client_answer/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files
    location /media/ {
        alias /home/cubinez85/client_answer/media/;
        expires 7d;
    }

    # Django Admin
    location /admin/ {
        proxy_pass http://client_answer_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Оптимизация для Gunicorn (Keep-Alive)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # API
    location /api/ {
        proxy_pass http://client_answer_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Оптимизация для Gunicorn (Keep-Alive)
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Timeouts (увеличены на случай тяжелых запросов TF-IDF/scikit-learn)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Default — точное совпадение для корня сайта
    location = / {
        return 301 /api/;
    }
}
